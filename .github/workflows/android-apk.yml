name: Build Android APK

on:
  push:
    branches:
      - arena/2aff49b3-order
    paths:
      - 'android/**'
      - 'index.html'
      - 'fonts/**'
      - 'vendor/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Saeedi-Essence-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK on the app branch
        if: github.ref == 'refs/heads/arena/2aff49b3-order'
        env:
          APK_SOURCE: android/app/build/outputs/apk/debug/app-debug.apk
          APK_DESTINATION: downloads/Saeedi-Essence-Android.apk
        run: |
          mkdir -p downloads
          cp "$APK_SOURCE" "$APK_DESTINATION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$APK_DESTINATION"
          if git diff --cached --quiet; then
            echo "The APK is unchanged; no commit is needed."
            exit 0
          fi
          git commit -m "Publish Android APK"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
