plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saeedi.essenceorders'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saeedi.essenceorders'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/webAssets')
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

def webAssetsDir = layout.buildDirectory.dir('generated/webAssets')
tasks.register('syncWebAppAssets', Sync) {
    from(rootProject.file('../index.html'))
    from(rootProject.file('../vendor')) { into 'vendor' }
    from(rootProject.file('../fonts')) { into 'fonts' }
    into(webAssetsDir)
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAppAssets'))
}
